[General]
encrypted-dns-server = https://8.8.8.8/dns-query, https://1.1.1.1/dns-query
encrypted-dns-follow-outbound-mode = true
always-real-ip = epdg.epc.att.net, epdg.epc.att-idns.net, *.srv.nintendo.net, *.n.n.srv.nintendo.net

[Rule]
AND,((PROTOCOL,DOH),(DOMAIN,223.5.5.5)),DIRECT
AND,((PROTOCOL,DOH),(DOMAIN,1.12.12.12)),DIRECT
AND,((PROTOCOL,DOH),(DOMAIN,8.8.8.8)),🇺🇸 US
AND,((PROTOCOL,DOH),(DOMAIN,1.1.1.1)),🇺🇸 US
AND,((PROTOCOL,DOH),(DOMAIN,1.0.0.1)),🇯🇵 JP
AND,((PROTOCOL,DOH),(DOMAIN,8.8.4.4)),TEST
DOMAIN-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/personal/surge/route/lan-direct.set,DIRECT,update-interval=43200
DOMAIN-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/personal/surge/route/test.set,TEST,update-interval=43200
