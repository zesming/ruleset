# Merge these snippets into an existing Mihomo / Smart configuration.
# DIRECT / PROXY / TEST below are examples. Bind ai-global to your AI proxy group,
# network-test to a test selection group (default US, optional JP and direct).
rule-providers:
  cn-direct-domain:
    type: http
    behavior: domain
    format: mrs
    url: https://raw.githubusercontent.com/zesming/ruleset/main/rules/mihomo/cn-direct-domain.mrs
    path: ./ruleset/zesming-cn-direct-domain.mrs
    interval: 43200
    proxy: PROXY
  cn-direct-special:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/zesming/ruleset/main/rules/mihomo/cn-direct-special.list
    path: ./ruleset/zesming-cn-direct-special.list
    interval: 43200
    proxy: PROXY
  cn-direct-process:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/zesming/ruleset/main/rules/mihomo/cn-direct-process.list
    path: ./ruleset/zesming-cn-direct-process.list
    interval: 43200
    proxy: PROXY
  network-test:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/zesming/ruleset/main/rules/network-test.list
    path: ./ruleset/zesming-network-test.list
    interval: 43200
    proxy: PROXY
  ai-cn:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/zesming/ruleset/main/rules/ai-cn.list
    path: ./ruleset/zesming-ai-cn.list
    interval: 43200
    proxy: PROXY
  ai-global:
    type: http
    behavior: classical
    format: text
    url: https://raw.githubusercontent.com/zesming/ruleset/main/rules/ai-global.list
    path: ./ruleset/zesming-ai-global.list
    interval: 43200
    proxy: PROXY
rules:
  # After local/infrastructure exceptions; before broad ad, Apple, Microsoft,
  # CDN, China and IP rules. network-test precedes AI rules.
  - RULE-SET,network-test,TEST
  - RULE-SET,ai-cn,DIRECT
  - RULE-SET,ai-global,PROXY
  # Keep existing ad/Apple/Microsoft/CDN/Telegram domain rules here.
  # Replace old direct/domestic DOMAIN providers at their original position,
  # before LAN/IP/GEOIP rules. Bind DIRECT to your existing direct policy group.
  - RULE-SET,cn-direct-domain,DIRECT
  - RULE-SET,cn-direct-special,DIRECT
  - RULE-SET,cn-direct-process,DIRECT
dns:
  nameserver-policy:
    # Keep network-test on its existing DNS path. Place AI selectors before cn-direct.
    # The foreign DoH endpoint must follow your existing proxy policy.
    'rule-set:ai-global':
      - https://dns.google/dns-query#PROXY
    'rule-set:ai-cn':
      - https://223.5.5.5/dns-query#DIRECT
      - https://doh.pub/dns-query#DIRECT
    # Merge at the old direct/domestic DNS selector's position. Keep other policies.
    'rule-set:cn-direct-domain,cn-direct-special':
      - https://223.5.5.5/dns-query#DIRECT
      - https://1.12.12.12/dns-query#DIRECT
