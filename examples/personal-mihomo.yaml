rules:
  - RULE-SET,lan-direct,DIRECT
  - RULE-SET,test,TEST
  - RULE-SET,reject-drop,REJECT-DROP
  - RULE-SET,reject,REJECT
  - RULE-SET,reject-rules,REJECT
  - RULE-SET,reject-no-drop,REJECT
  - RULE-SET,reject-extra-rules,REJECT
  - RULE-SET,jp-proxy,JP
  - RULE-SET,us-proxy,US
  - RULE-SET,cn-direct,DIRECT
  - RULE-SET,cn-direct-extra,DIRECT
  - RULE-SET,lan-direct-ip,DIRECT
  - RULE-SET,reject-ip,REJECT
  - RULE-SET,jp-proxy-ip,JP
  - RULE-SET,us-proxy-ip,US
  - RULE-SET,direct-ip,DIRECT
  - RULE-SET,us-proxy-ip-late,US
  - RULE-SET,cn-direct-ip,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,US
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://8.8.8.8/dns-query#US
    - https://1.1.1.1/dns-query#US
  nameserver-policy:
    "rule-set:lan-direct":
      - "system"
    "rule-set:test":
      - "https://8.8.4.4/dns-query#TEST"
    "rule-set:reject-drop,reject,reject-rules,reject-no-drop,reject-extra-rules":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:jp-proxy":
      - "https://1.0.0.1/dns-query#JP"
    "rule-set:us-proxy":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:cn-direct,cn-direct-extra":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "epdg.epc.att.net"
    - "epdg.epc.att-idns.net"
    - "+.srv.nintendo.net"
    - "*.n.n.srv.nintendo.net"
