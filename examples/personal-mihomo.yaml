rules:
  - RULE-SET,infra-lan,DIRECT
  - RULE-SET,att-us,US
  - RULE-SET,network-test,TEST
  - RULE-SET,ai-cn,DIRECT
  - RULE-SET,ai-global,US
  - RULE-SET,apple-intelligence,US
  - RULE-SET,jp-manual,JP
  - RULE-SET,reject-drop,REJECT-DROP
  - RULE-SET,reject-domains,REJECT
  - RULE-SET,reject-extra,REJECT
  - RULE-SET,reject-rules,REJECT
  - RULE-SET,reject-no-drop,REJECT
  - RULE-SET,sogouinput,REJECT
  - RULE-SET,apple-services,DIRECT
  - RULE-SET,game-download,DIRECT
  - RULE-SET,download,DIRECT
  - RULE-SET,cdn,US
  - RULE-SET,microsoft,DIRECT
  - RULE-SET,netease,DIRECT
  - RULE-SET,telegram,US
  - RULE-SET,cn-direct-domain,DIRECT
  - RULE-SET,cn-direct-special,DIRECT
  - RULE-SET,cn-direct-process,DIRECT
  - RULE-SET,reject-ip,REJECT
  - RULE-SET,ai-ip,US
  - RULE-SET,apple-ip,DIRECT
  - RULE-SET,cdn-ip,US
  - RULE-SET,domestic-ip,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,US
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://8.8.8.8/dns-query#US
    - https://1.1.1.1/dns-query#US
  nameserver-policy:
    "rule-set:infra-lan":
      - "system"
    "rule-set:att-us":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:network-test":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:ai-cn":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:ai-global":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:apple-intelligence":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:jp-manual-dns":
      - "https://1.0.0.1/dns-query#JP"
      - "https://8.8.4.4/dns-query#JP"
    "rule-set:reject-drop":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:reject-domains":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:reject-extra":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:reject-rules-dns":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:reject-no-drop":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:sogouinput-dns":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:apple-services-dns":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:game-download":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:download":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:cdn":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:microsoft":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:netease":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:telegram":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:cn-direct-domain":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
    "rule-set:cn-direct-special":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
