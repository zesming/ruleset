rules:
  - RULE-SET,priority-lan-domain,DIRECT
  - RULE-SET,priority-test-domain,TEST
  - RULE-SET,priority-reject-classical,REJECT-DROP
  - RULE-SET,priority-reject-domain,REJECT
  - RULE-SET,priority-reject-classical-2,REJECT
  - RULE-SET,priority-reject-classical-3,REJECT
  - RULE-SET,priority-reject-classical-4,REJECT
  - RULE-SET,priority-jp-classical,JP
  - RULE-SET,priority-us-classical,US
  - RULE-SET,priority-cn-direct-domain,DIRECT
  - RULE-SET,priority-cn-direct-classical,DIRECT
  - RULE-SET,priority-lan-ip-classical,DIRECT
  - RULE-SET,priority-reject-ip-classical,REJECT
  - RULE-SET,priority-jp-ip-classical,JP
  - RULE-SET,priority-us-ip-classical,US
  - RULE-SET,priority-direct-ip-classical,DIRECT
  - RULE-SET,priority-us-ip-late-classical,US
  - RULE-SET,priority-cn-ip-classical,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,US
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://8.8.8.8/dns-query#US
    - https://1.1.1.1/dns-query#US
  nameserver-policy:
    "rule-set:priority-lan-domain":
      - "system"
    "rule-set:priority-test-domain":
      - "https://8.8.4.4/dns-query#TEST"
    "rule-set:priority-reject-classical,priority-reject-domain,priority-reject-classical-2,priority-reject-classical-3,priority-reject-classical-4":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:priority-jp-classical":
      - "https://1.0.0.1/dns-query#JP"
    "rule-set:priority-us-classical":
      - "https://8.8.8.8/dns-query#US"
      - "https://1.1.1.1/dns-query#US"
    "rule-set:priority-cn-direct-domain,priority-cn-direct-classical":
      - "https://223.5.5.5/dns-query#DIRECT"
      - "https://1.12.12.12/dns-query#DIRECT"
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "epdg.epc.att.net"
    - "epdg.epc.att-idns.net"
    - "+.srv.nintendo.net"
    - "*.n.n.srv.nintendo.net"
