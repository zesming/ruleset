rules:
  - RULE-SET,lan-direct,🚀 Direct
  - RULE-SET,reject-drop,⛔️ Reject-Drop
  - RULE-SET,reject,⛔️ Reject
  - RULE-SET,reject-rules,⛔️ Reject
  - RULE-SET,test,⚒️ Test
  - RULE-SET,jp-proxy,🇯🇵 JP
  - RULE-SET,us-proxy,🇺🇸 US
  - RULE-SET,cn-direct,🚀 Direct
  - RULE-SET,cn-direct-extra,🚀 Direct
  - RULE-SET,lan-direct-ip,🚀 Direct
  - RULE-SET,reject-ip,⛔️ Reject
  - RULE-SET,jp-proxy-ip,🇯🇵 JP
  - RULE-SET,us-proxy-ip,🇺🇸 US
  - RULE-SET,direct-ip,🚀 Direct
  - RULE-SET,us-proxy-ip-late,🇺🇸 US
  - RULE-SET,cn-direct-ip,🚀 Direct
  - GEOIP,CN,🚀 Direct,no-resolve
  - MATCH,🇺🇸 US
proxy-groups:
  - name: "⚒️ Test"
    type: select
    proxies:
      - "🇺🇸 US"
      - "🇯🇵 JP"
      - "🚀 Direct"
  - name: "🚀 Direct"
    type: select
    proxies:
      - "DIRECT"
  - name: "⛔️ Reject"
    type: select
    proxies:
      - "REJECT"
  - name: "⛔️ Reject-Drop"
    type: select
    proxies:
      - "REJECT-DROP"
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://8.8.8.8/dns-query#🇺🇸 US
    - https://1.1.1.1/dns-query#🇺🇸 US
  nameserver-policy:
    "rule-set:lan-direct":
      - "system"
    "rule-set:reject-drop,reject,reject-rules":
      - "https://8.8.8.8/dns-query#🇺🇸 US"
      - "https://1.1.1.1/dns-query#🇺🇸 US"
    "rule-set:test":
      - "https://8.8.4.4/dns-query#⚒️ Test"
    "rule-set:jp-proxy":
      - "https://1.0.0.1/dns-query#🇯🇵 JP"
    "rule-set:us-proxy":
      - "https://8.8.8.8/dns-query#🇺🇸 US"
      - "https://1.1.1.1/dns-query#🇺🇸 US"
    "rule-set:cn-direct,cn-direct-extra":
      - "https://223.5.5.5/dns-query#🚀 Direct"
      - "https://1.12.12.12/dns-query#🚀 Direct"
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "epdg.epc.att.net"
    - "epdg.epc.att-idns.net"
    - "+.srv.nintendo.net"
    - "*.n.n.srv.nintendo.net"
