# Merge into [Rule] in an existing Surge configuration.
# Replace PROXY with your existing AI policy name; no nodes are supplied here.
# Place after local exceptions, before broad domain/IP rules.
[Rule]
RULE-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/ai-cn.list,DIRECT,update-interval=43200
RULE-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/ai-global.list,PROXY,update-interval=43200
