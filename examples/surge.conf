# Merge into [Rule] in an existing Surge configuration.
# Replace PROXY / TEST with your existing policy names; no nodes are supplied here.
# Place after local exceptions, before broad domain/IP rules.
# Pure-domain categories use DOMAIN-SET (.set) for optimized lookup;
# ai-global contains DOMAIN-WILDCARD and must use RULE-SET (.list).
[Rule]
DOMAIN-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/network-test.set,TEST,update-interval=43200
DOMAIN-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/ai-cn.set,DIRECT,update-interval=43200
RULE-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/ai-global.list,PROXY,update-interval=43200
# Surge macOS only (iOS ignores PROCESS-NAME); AI process fallback, placed after the AI domain sets.
RULE-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/ai-process.list,PROXY,update-interval=43200
# Keep existing ad/Apple/Microsoft/CDN/Telegram domain rules here, then replace
# old direct/domestic at their original position, before LAN/IP/GEOIP rules.
DOMAIN-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/cn-direct.set,DIRECT,update-interval=43200
RULE-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/cn-direct-special.list,DIRECT,update-interval=43200
RULE-SET,https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/cn-direct-platform.list,DIRECT,update-interval=43200

[Host]
# Merge at the old direct/domestic Host selector's position; keep other entries.
# The platform process/User-Agent layer is deliberately absent from DNS.
DOMAIN-SET:https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/cn-direct.set = server:https://223.5.5.5/dns-query, https://doh.pub/dns-query
RULE-SET:https://raw.githubusercontent.com/zesming/ruleset/main/rules/surge/cn-direct-special.list = server:https://223.5.5.5/dns-query, https://doh.pub/dns-query
