name: Update ruleset
on:
  schedule:
    - cron: '0 0 * * *' # 08:00 Asia/Shanghai
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'policy.json'
      - 'profiles/**'
      - 'licenses/**'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ruleset-pr-{0}', github.event.pull_request.number) || 'ruleset-publish' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          persist-credentials: false
          fetch-depth: 0
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s tests -v
      - name: Replay proposed bundle with the fixed Linux converter
        if: github.event_name == 'pull_request'
        env:
          MIHOMO_CONVERTER: ${{ runner.temp }}/ruleset-mihomo
        run: |
          python3 scripts/install_converter.py --output "$MIHOMO_CONVERTER"
          python3 scripts/build.py validate --offline --allow-cross-platform-replay
          python3 scripts/personal_profile.py validate --offline
          python3 scripts/profile_clients.py render --out-dir "$RUNNER_TEMP/personal-examples"
          diff -u examples/personal-mihomo.yaml "$RUNNER_TEMP/personal-examples/personal-mihomo.yaml"
          diff -u examples/personal-surge.conf "$RUNNER_TEMP/personal-examples/personal-surge.conf"
      - name: Retain proposed replay diagnostics
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.base }}
          fetch-depth: 0
      - name: Ensure checked main is still current
        env:
          BASE_SHA: ${{ needs.check.outputs.base }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
      - name: Build and validate current upstream candidate
        env:
          MIHOMO_CONVERTER: ${{ runner.temp }}/ruleset-mihomo
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/install_converter.py --output "$MIHOMO_CONVERTER"
          python3 scripts/build.py update
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          if not json.loads(Path('policy.json').read_text())['publish_hold']['enabled']:
              subprocess.run(['python3', 'scripts/personal_profile.py', 'update'], check=True)
          PY
      - name: Check release bundle or held audit
        env:
          MIHOMO_CONVERTER: ${{ runner.temp }}/ruleset-mihomo
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          held = json.loads(Path('policy.json').read_text())['publish_hold']['enabled']
          if held:
              changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
              if set(changed) - {'CHECKED_AT.json'}:
                  raise SystemExit('Publishing is on hold: live bundle must not change')
          else:
              subprocess.run(['python3', 'scripts/build.py', 'validate', '--offline', '--allow-cross-platform-replay'], check=True)
              subprocess.run(['python3', 'scripts/personal_profile.py', 'validate', '--offline'], check=True)
          PY
      - name: Publish one complete bundle without overwriting newer work
        env:
          BASE_SHA: ${{ needs.check.outputs.base }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$BASE_SHA"
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          allowed = ['rules', 'upstream', 'licenses', 'manifest.json', 'CHECKED_AT.json']
          subprocess.run(['git', 'add', '--', *[p for p in allowed if Path(p).exists()]], check=True)
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          held = json.loads(Path('policy.json').read_text())['publish_hold']['enabled']
          if held and set(paths) - {'CHECKED_AT.json'}:
              raise SystemExit('Publishing is on hold: only a successful audit may be committed')
          for p in paths:
              if p not in {'manifest.json', 'CHECKED_AT.json'} and not p.startswith(('rules/', 'upstream/', 'licenses/')):
                  raise SystemExit('Unexpected staged path: ' + p)
          PY
          if git diff --cached --quiet; then
            echo 'No new accepted bundle or due audit record.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update accepted ruleset snapshot'
          git push origin HEAD:main
      - name: Retain update diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build-report/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
